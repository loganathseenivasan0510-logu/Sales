name: Desktop app (Blazor + SQLite) – build, tests, security

on:
  push:
    branches: [feature/blazor-sqlite, main]
    paths: ['desktop/**', 'tests/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: write   # nur für den Entwurfs-Release (nicht öffentlich)

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Diagnose static web assets
        shell: pwsh
        run: |
          $proj = 'desktop/SalesofLoga.Desktop/SalesofLoga.Desktop.csproj'
          dotnet restore $proj -r win-x64 | Out-Null
          Get-ChildItem "$env:USERPROFILE/.nuget/packages" -Directory | Where-Object Name -like '*internal.assets*' | ForEach-Object { Get-ChildItem $_.FullName -Recurse -File | Select-Object -First 15 FullName }
          dotnet msbuild $proj -t:ResolveStaticWebAssetsInputs -p:RuntimeIdentifier=win-x64 -p:Configuration=Release -getProperty:RequiresAspNetWebAssets -getItem:StaticWebAsset > swa.json
          $j = Get-Content swa.json -Raw | ConvertFrom-Json
          "RequiresAspNetWebAssets = $($j.Properties.RequiresAspNetWebAssets)"
          $j.Items.StaticWebAsset | Select-Object @{n='Rel';e={$_.RelativePath}}, SourceType, AssetKind, AssetMode | Format-Table -AutoSize | Out-String -Width 220

      - name: Publish single-file EXE (win-x64, self-contained, assets embedded)
        shell: pwsh
        run: ./desktop/publish.ps1 -Output publish

      - name: Show publish output
        shell: pwsh
        run: |
          Get-ChildItem publish -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
          New-Item -ItemType Directory -Force artifacts | Out-Null
          (Get-FileHash publish/SalesofLoga.exe -Algorithm SHA256).Hash | Out-File artifacts/SalesofLoga.exe.sha256

      - name: Self-test (winsqlite3, BLOBs, backup)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process publish/SalesofLoga.exe -ArgumentList '--selftest','--data',"`"$d`"" -Wait -PassThru -NoNewWindow
          Get-Content "$d/logs/*.log"
          if ($p.ExitCode -ne 0) { throw "Selftest failed with exit code $($p.ExitCode)" }

      - name: External security tests (+ built-in security check)
        shell: pwsh
        run: ./tests/security/Invoke-SecurityTests.ps1 -ExePath publish/SalesofLoga.exe -OutFile artifacts/security-tests-external.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.49.1
          python -m playwright install chromium

      - name: UI tests (Playwright against the EXE)
        run: python tests/e2e/test_desktop.py --exe publish/SalesofLoga.exe --out artifacts

      - name: Upload EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SalesofLoga-win-x64
          path: |
            publish/SalesofLoga.exe
            artifacts/SalesofLoga.exe.sha256
            desktop/README.md
          retention-days: 30

      - name: Upload test & security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/
          retention-days: 30

      - name: Draft release with EXE and reports (not public)
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path artifacts/* -DestinationPath test-reports.zip -Force
          $assets = @('test-reports.zip')
          if (Test-Path publish/SalesofLoga.exe) { $assets += 'publish/SalesofLoga.exe' }
          $tag = "desktop-build-${{ github.run_number }}"
          $notes = "Automated build ${{ github.sha }} – job status: ${{ job.status }}. Draft = only visible to repository admins."
          gh release create $tag @assets --draft --prerelease --target ${{ github.sha }} --title "SalesofLoga Desktop build ${{ github.run_number }}" --notes $notes
